[workspace]
members = ["core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Shugo Kawamura"]

[package]
name = "roland-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Rust library for Roland VR-6HD / V-160HD / V-60HD remote control (std environment)"
repository = "https://github.com/FlowingSPDG/roland-rs"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
roland-core = { path = "core", version = "0.1.0" }
tokio = { version = "1", optional = true, default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
